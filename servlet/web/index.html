<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill-badge verification portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">

<main class="landing" id="landing" role="button" tabindex="0"
      aria-label="Enter the portal">

  <h1 class="landing-title" data-warp>skill&#8209;badge<br>verification<br>portal</h1>

  <p class="landing-cue" data-warp aria-hidden="true">tap anywhere to begin</p>

</main>

<!-- data-warp marks the text js/warp-text.js draws through WebGL. The
     elements stay in the DOM with their boxes, their links and their
     place in the accessibility tree; only their ink moves to the
     canvas, and only once the canvas is proven to be drawing. -->
<footer class="landing-foot">
  <a href="verify.html" data-warp>verify a badge</a>
  <span aria-hidden="true" data-warp>&middot;</span>
  <a href="benchmark.html" data-warp>cgi vs servlet benchmark</a>
</footer>

<script>
(function () {
  var landing = document.getElementById("landing");
  var target  = "role.html";
  var gone    = false;

  // Respect a viewer who has asked for less motion: no fade, just go.
  var reduced = window.matchMedia
             && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function begin() {
    if (gone) { return; }
    gone = true;

    if (reduced) { location.href = target; return; }

    document.body.classList.add("is-leaving");
    // Matches the 420ms transition in the stylesheet, with a little
    // slack, then navigates regardless so a dropped transitionend
    // cannot strand the visitor on a faded-out page.
    setTimeout(function () { location.href = target; }, 460);
  }

  // "Tap anywhere" must not mean "swallow the footer".
  //
  // The exemption covers the whole footer, not just its anchors. Those
  // links are small, they sit inside the tap-anywhere region, and the
  // warp shifts their painted glyphs a few pixels off the box that
  // actually receives the click -- so a near-miss would quietly take
  // someone to the role page instead of where they aimed. Treating the
  // footer as a deliberate control strip makes the miss do nothing,
  // which is the better failure.
  //
  // closest() exists only on Elements, so guard before calling it: a
  // click whose target is not an Element would otherwise throw and
  // silently kill the handler.
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t && typeof t.closest === "function"
          && t.closest("a, .landing-foot")) { return; }
    begin();
  });

  // Keyboard and assistive tech reach the same action.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      if (document.activeElement && document.activeElement.tagName === "A") {
        return;
      }
      e.preventDefault();
      begin();
    }
  });

  landing.addEventListener("focus", function () {
    landing.classList.add("is-focused");
  });
  landing.addEventListener("blur", function () {
    landing.classList.remove("is-focused");
  });
})();
</script>

<script src="js/warp-text.js" defer></script>
</body>
</html>
